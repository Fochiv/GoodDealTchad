kind = "web"
previewPath = "/"
title = "Good Deal Tchad"
description = "Good Deal Tchad vend des forfaits internet Airtel et Moov au Tchad avec paiement sécurisé par Airtel Money ou Moov Money via AshtechPay."
version = "1.0.0"
id = "artifacts/forfaits-gabon"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23841

[services.development]
run = "pnpm --filter @workspace/forfaits-gabon run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/forfaits-gabon", "run", "build" ]
serve = "static"
publicDir = "artifacts/forfaits-gabon/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23841"
BASE_PATH = "/"
